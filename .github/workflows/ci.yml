name: CI — Pipeline & Cropping Engine Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Python Pipeline Syntax & Unit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all pipeline scripts
        run: |
          python3 -m py_compile scripts/*.py

      - name: Verify Arabic normalization & catalog schema invariants
        run: |
          python3 -c '
          import ast, pathlib
          scripts = list(pathlib.Path("scripts").glob("*.py"))
          assert len(scripts) >= 10, "Expected pipeline scripts in scripts/"
          for s in scripts:
              ast.parse(s.read_text(encoding="utf-8"))
          print(f"Verified AST for {len(scripts)} pipeline modules.")
          '
